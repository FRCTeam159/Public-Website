name: Deploy PR preview

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy preview
        id: preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: site/
          preview-branch: gh-pages
          # The link checker below hits the live preview URL, so make sure
          # the GitHub Pages deployment has actually finished before we
          # check it — otherwise we'd be racing the CDN and get false
          # failures on a preview that just hasn't gone live yet.
          wait-for-pages-deployment: true

      - name: Check links on the live preview
        if: steps.preview.outputs.deployment-action == 'deploy'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress ${{ steps.preview.outputs.preview-url }}
          fail: true
